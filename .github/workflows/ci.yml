# CI — runs typecheck, lint, and tests on every push + pull request.
# Blocks PR merges if any check fails. Uses Bun for speed (matches local dev).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same branch when a new push arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck + Lint + Test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

  build:
    name: Build verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          # Next.js needs a DATABASE_URL at build time for drizzle-kit migrate.
          # Use a dummy SQLite URL — migrations are forward-only and the
          # build only needs to compile, not connect to a real DB.
          DATABASE_URL: "file:/tmp/ci-build.db"
          # Suppress Next.js telemetry in CI.
          NEXT_TELEMETRY_DISABLED: "1"
